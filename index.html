<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi Día</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F0;--surface:#FFF;--surface2:#F0EDE6;
  --text:#1A1814;--text2:#6B6760;--text3:#A8A49E;
  --border:rgba(26,24,20,.1);--border2:rgba(26,24,20,.18);
  --alta:#C13B2A;--alta-bg:#FDF0EE;
  --media:#C17A1A;--media-bg:#FDF6EA;
  --baja:#3A7A4A;--baja-bg:#EEF6F0;
  --hoy:#2A52A8;--hoy-bg:#EAF0FB;
  --cont:#2A52A8;--cont-bg:#EAF0FB;--cont-dk:#0C447C;
  --trib:#7A3AAA;--trib-bg:#F3EEFE;--trib-dk:#3C3489;
  --prov:#1A7A5A;--prov-bg:#EAF6F0;--prov-dk:#085041;
  --otro:#8A6A2A;--otro-bg:#F6F0E4;--otro-dk:#5A4010;
  --r:16px;--rs:10px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141210;--surface:#1E1C19;--surface2:#252320;
  --text:#F0EDE6;--text2:#9A9690;--text3:#5A5852;
  --border:rgba(240,237,230,.08);--border2:rgba(240,237,230,.15);
  --alta:#E05A48;--alta-bg:#2A1A17;--media:#E09A30;--media-bg:#271E0F;
  --baja:#5AAA6A;--baja-bg:#131E16;--hoy:#6A8ADE;--hoy-bg:#111A30;
  --cont:#6A8ADE;--cont-bg:#111A30;--cont-dk:#B5D4F4;
  --trib:#AA7ADE;--trib-bg:#1A112A;--trib-dk:#CECBF6;
  --prov:#5AAA8A;--prov-bg:#0A1F18;--prov-dk:#9FE1CB;
  --otro:#D4A850;--otro-bg:#1E1608;--otro-dk:#FAC775;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
.screen{display:none;min-height:100vh}.screen.active{display:block}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:.5px solid var(--border);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;background:none;border:none;cursor:pointer;font-family:inherit;font-size:10px;color:var(--text3);transition:color .15s;position:relative}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none}
.nav-btn.active{color:var(--hoy)}
.nav-badge{position:absolute;top:6px;right:calc(50% - 18px);background:var(--alta);color:#fff;font-size:9px;font-weight:500;padding:1px 5px;border-radius:20px;min-width:16px;text-align:center}
.page-hdr{padding:48px 22px 14px;border-bottom:.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;font-family:inherit;padding:0;margin-bottom:10px}
.back-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.page-title{font-family:'DM Serif Display',serif;font-size:24px;display:flex;align-items:center;gap:10px}
.title-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.stats-pill{display:flex;background:var(--surface2);border-radius:40px;overflow:hidden;width:fit-content;margin-top:10px}
.sp{padding:6px 14px;text-align:center}.sp+.sp{border-left:.5px solid var(--border2)}
.sp-n{font-size:15px;font-weight:500}.sp-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
/* HOME */
.home-hdr{padding:48px 22px 12px}
.home-greeting{font-family:'DM Serif Display',serif;font-size:28px;line-height:1.2}
.home-date{font-size:13px;color:var(--text2);margin-top:3px}
.home-stats{display:flex;gap:8px;margin-top:12px}
.hstat{flex:1;background:var(--surface);border:.5px solid var(--border);border-radius:var(--rs);padding:10px;text-align:center}
.hstat-n{font-size:20px;font-weight:500}.hstat-l{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.home-tabs{display:flex;gap:0;background:var(--surface2);border-radius:40px;padding:3px;margin:10px 22px 0}
.htab{flex:1;font-size:12px;font-weight:500;padding:7px 0;border-radius:40px;border:none;background:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .15s;text-align:center}
.htab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hpanel{display:none;padding:12px 22px 90px}.hpanel.active{display:block}
/* AREAS */
.areas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 22px 90px}
.area-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:16px 14px 12px;cursor:pointer;transition:transform .15s;-webkit-user-select:none;user-select:none}
.area-card:active{transform:scale(.97)}
.area-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.area-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.area-icon svg{width:17px;height:17px;stroke-width:1.8;fill:none}
.area-arrow svg{width:14px;height:14px;stroke:var(--text3);stroke-width:2;fill:none}
.area-name{font-size:15px;font-weight:500;margin-bottom:7px}
.area-pills{display:flex;gap:4px;flex-wrap:wrap}
.area-pill{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px}
.a-cont .area-icon{background:var(--cont-bg)}.a-cont .area-icon svg{stroke:var(--cont)}.a-cont .area-name{color:var(--cont-dk)}.a-cont .area-pill{background:var(--cont-bg);color:var(--cont-dk)}
.a-trib .area-icon{background:var(--trib-bg)}.a-trib .area-icon svg{stroke:var(--trib)}.a-trib .area-name{color:var(--trib-dk)}.a-trib .area-pill{background:var(--trib-bg);color:var(--trib-dk)}
.a-prov .area-icon{background:var(--prov-bg)}.a-prov .area-icon svg{stroke:var(--prov)}.a-prov .area-name{color:var(--prov-dk)}.a-prov .area-pill{background:var(--prov-bg);color:var(--prov-dk)}
.a-otro .area-icon{background:var(--otro-bg)}.a-otro .area-icon svg{stroke:var(--otro)}.a-otro .area-name{color:var(--otro-dk)}.a-otro .area-pill{background:var(--otro-bg);color:var(--otro-dk)}
/* HOY WRAP */
.hoy-wrap{background:var(--hoy-bg);border:.5px solid rgba(42,82,168,.2);border-radius:var(--r);padding:14px}
.hoy-label{font-size:11px;font-weight:500;color:var(--hoy);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.hoy-badge{background:var(--hoy);color:var(--hoy-bg);font-size:10px;padding:1px 7px;border-radius:20px}
/* ALERTS */
.alerts{padding:10px 22px 0;display:flex;flex-direction:column;gap:7px}
.alert{border-radius:var(--rs);padding:9px 12px;font-size:13px;display:flex;align-items:center;gap:9px;border:.5px solid;animation:fadeIn .3s}
.alert-text{flex:1}.alert-close{background:none;border:none;cursor:pointer;font-size:16px;color:inherit;opacity:.5;padding:0}
.alert-danger{background:var(--alta-bg);border-color:var(--alta);color:var(--alta)}
.alert-warn{background:var(--media-bg);border-color:var(--media);color:var(--media)}
.alert-info{background:var(--hoy-bg);border-color:var(--hoy);color:var(--hoy)}
/* FORM */
.section{padding:14px 22px 0}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.section-title{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:5px}
.section-title svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none}
.section-count{font-size:11px;background:var(--surface2);color:var(--text2);padding:2px 8px;border-radius:20px}
.add-form{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.add-r1{display:flex;gap:7px;margin-bottom:7px}
.add-r2{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fi{background:var(--surface2);border:none;border-radius:var(--rs);padding:8px 11px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.fi::placeholder{color:var(--text3)}.fi:focus{box-shadow:0 0 0 1.5px var(--border2)}
.fi-text{flex:1;min-width:80px}
.prio-btns{display:flex;gap:4px}
.prio-btn{font-size:12px;font-weight:500;padding:6px 10px;border-radius:20px;border:1.5px solid transparent;cursor:pointer;font-family:inherit;transition:all .15s}
.prio-btn.alta{background:var(--alta-bg);color:var(--alta)}.prio-btn.media{background:var(--media-bg);color:var(--media)}.prio-btn.baja{background:var(--baja-bg);color:var(--baja)}
.prio-btn.selected.alta{border-color:var(--alta)}.prio-btn.selected.media{border-color:var(--media)}.prio-btn.selected.baja{border-color:var(--baja)}
.add-main{margin-left:auto;background:var(--text);color:var(--bg);border:none;border-radius:var(--rs);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.add-main:active{transform:scale(.97)}
.sub-wrap{position:relative;flex:1;min-width:110px}
.sub-dd{position:absolute;top:calc(100% + 3px);left:0;right:0;background:var(--surface);border:.5px solid var(--border2);border-radius:var(--rs);z-index:50;max-height:130px;overflow-y:auto;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.sub-opt{padding:8px 11px;font-size:13px;cursor:pointer;color:var(--text)}.sub-opt:hover{background:var(--surface2)}
.novc-label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap}
.novc-label input{width:14px;height:14px;cursor:pointer}
/* TASK CARDS */
.task-list{display:flex;flex-direction:column;gap:7px}
.task-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;animation:fadeIn .25s}
.task-card.done{opacity:.4}.task-card.done .task-title{text-decoration:line-through;color:var(--text3)}
.task-card.overdue{border-color:rgba(193,59,42,.3);background:var(--alta-bg)}
.task-card.hoy-card{border-left:3px solid var(--hoy);border-radius:0 var(--r) var(--r) 0}
.check-btn{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;margin-top:2px}
.check-btn:hover{border-color:var(--text)}.check-btn.checked{background:var(--text);border-color:var(--text)}
.check-btn svg{width:9px;height:9px;stroke:var(--bg);stroke-width:2.5;fill:none}
.task-body{flex:1;min-width:0}.task-title{font-size:14px;color:var(--text)}
.task-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.prio-tag{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px}
.prio-tag.alta{background:var(--alta-bg);color:var(--alta)}.prio-tag.media{background:var(--media-bg);color:var(--media)}.prio-tag.baja{background:var(--baja-bg);color:var(--baja)}
.due-tag{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:3px}
.due-tag.late{color:var(--alta);font-weight:500}.due-tag.today{color:var(--hoy);font-weight:500}
.subarea-tag{font-size:11px;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--surface2);color:var(--text2);border:.5px solid var(--border2)}
.area-tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.area-tag-cont{background:var(--cont-bg);color:var(--cont-dk)}.area-tag-trib{background:var(--trib-bg);color:var(--trib-dk)}
.area-tag-prov{background:var(--prov-bg);color:var(--prov-dk)}.area-tag-otro{background:var(--otro-bg);color:var(--otro-dk)}
.moved-tag{font-size:10px;color:var(--text3)}
.task-actions{display:flex;gap:2px;align-items:center;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text3);padding:5px;border-radius:var(--rs);display:flex;align-items:center;transition:color .15s,background .15s}
.icon-btn:hover{color:var(--text);background:var(--surface2)}
.icon-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none}
.group-hdr{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:12px 0 5px;display:flex;align-items:center;gap:8px}
.group-hdr-line{flex:1;height:.5px;background:var(--border)}
.empty-msg{text-align:center;padding:20px 0;font-size:13px;color:var(--text3)}
.pb90{padding-bottom:90px}
/* SUBTASKS */
.sub-toggle{background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:3px 6px;border-radius:20px;font-family:inherit;display:flex;align-items:center;gap:4px}
.sub-toggle:hover{background:var(--surface2);color:var(--text2)}
.sub-toggle svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;transition:transform .2s}
.sub-toggle.open svg{transform:rotate(90deg)}
.sub-prog{height:3px;background:var(--border);border-radius:3px;margin-top:4px;overflow:hidden}
.sub-prog-bar{height:100%;background:var(--baja);border-radius:3px;transition:width .3s}
.subtask-list{margin-top:7px;display:flex;flex-direction:column;gap:4px}
.subtask-item{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:var(--rs);background:var(--surface2)}
.subtask-item.done-sub .stxt{text-decoration:line-through;color:var(--text3)}
.sch{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.sch:hover{border-color:var(--baja)}.sch.checked{background:var(--baja);border-color:var(--baja)}
.sch svg{width:8px;height:8px;stroke:var(--bg);stroke-width:2.5;fill:none}
.stxt{flex:1;font-size:13px;color:var(--text)}
.sdel{background:none;border:none;cursor:pointer;color:var(--text3);padding:2px;font-size:14px;line-height:1;opacity:0;transition:opacity .15s}
.subtask-item:hover .sdel{opacity:1}
.sadd-row{display:flex;gap:5px;margin-top:5px}
.sadd-inp{flex:1;background:var(--surface2);border:none;border-radius:var(--rs);padding:6px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.sadd-inp::placeholder{color:var(--text3)}.sadd-inp:focus{box-shadow:0 0 0 1.5px var(--border2)}
.sadd-btn{background:var(--surface2);border:.5px solid var(--border2);border-radius:var(--rs);padding:6px 11px;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit}
.sadd-btn:hover{color:var(--text)}
/* BOT BAR */
.bot-bar{position:fixed;bottom:60px;left:0;right:0;background:var(--bg);border-top:.5px solid var(--border);padding:9px 18px;display:flex;justify-content:center;gap:8px;z-index:10}
.bot-btn{font-size:12px;font-weight:500;padding:8px 14px;border-radius:40px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:4px}
.bot-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none}
.bot-btn:hover{background:var(--surface2);color:var(--text)}
.bot-btn.danger{color:var(--alta);border-color:rgba(193,59,42,.25)}.bot-btn.danger:hover{background:var(--alta-bg)}
/* CALENDAR */
.cal-hdr{padding:48px 20px 10px;border-bottom:.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.cal-title{font-family:'DM Serif Display',serif;font-size:22px;margin-bottom:8px}
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-month{font-size:15px;font-weight:500}
.cal-nav-btns{display:flex;gap:3px}
.cal-nav-btn{background:var(--surface2);border:none;border-radius:var(--rs);width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.cal-nav-btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none}
.cal-nav-btn:hover{color:var(--text)}
.cal-today-btn{font-size:12px;background:var(--surface2);border:none;border-radius:40px;padding:6px 12px;cursor:pointer;color:var(--text2);font-family:inherit}
.cal-legend{display:flex;gap:10px;padding:8px 18px 0;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text2)}
.leg-dot{width:7px;height:7px;border-radius:50%}
.cal-grid{padding:8px 14px 0}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
.cal-dow{font-size:10px;color:var(--text3);text-align:center;padding:2px 0;font-weight:500}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-day{height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;border:.5px solid transparent;transition:background .12s}
.cal-day:hover{background:var(--surface2)}.cal-day.today{background:var(--hoy-bg);border-color:rgba(42,82,168,.25)}
.cal-day.selected{background:var(--hoy);border-color:var(--hoy)}.cal-day.selected .cal-day-n{color:#fff}
.cal-day.other-month .cal-day-n{color:var(--text3);opacity:.4}
.cal-day.has-overdue{border-color:rgba(193,59,42,.4);background:var(--alta-bg)}.cal-day.has-overdue.selected{background:var(--alta);border-color:var(--alta)}
.cal-day-n{font-size:12px;color:var(--text);line-height:1}.cal-day.today .cal-day-n{font-weight:500;color:var(--hoy)}
.cal-dots{display:flex;gap:2px;margin-top:2px;justify-content:center}
.cal-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.cal-detail{padding:10px 16px 90px}
.cal-detail-date{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:10px;padding-bottom:8px;border-bottom:.5px solid var(--border)}
.cal-task-item{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;display:flex;align-items:center;gap:9px;margin-bottom:7px}
.cal-task-item.overdue-item{background:var(--alta-bg);border-color:rgba(193,59,42,.3)}.cal-task-item.done-item{opacity:.4}.cal-task-item.done-item .cal-task-text{text-decoration:line-through}
.cal-area-bar{width:3px;border-radius:3px;align-self:stretch;flex-shrink:0}
.cal-task-body{flex:1;min-width:0}.cal-task-text{font-size:13px;color:var(--text)}
.cal-task-meta{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap;align-items:center}
.cal-no-tasks{text-align:center;padding:22px 0;font-size:13px;color:var(--text3)}
/* EDIT MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:18px 18px 38px;width:100%;max-width:720px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:15px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.modal-close{background:none;border:none;cursor:pointer;color:var(--text2);font-size:22px;line-height:1;padding:0}
.modal input[type=text]{width:100%;background:var(--surface2);border:none;border-radius:var(--rs);padding:9px 11px;font-size:14px;color:var(--text);font-family:inherit;outline:none;margin-bottom:9px}
.modal input[type=text]:focus{box-shadow:0 0 0 1.5px var(--border2)}
.modal-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.modal input[type=date],.modal input[type=time]{background:var(--surface2);border:none;border-radius:var(--rs);padding:8px 9px;font-size:13px;color:var(--text);font-family:inherit;outline:none}
.modal-save{background:var(--text);color:var(--bg);border:none;border-radius:var(--rs);padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-left:auto}
.modal-save:active{transform:scale(.97)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:8px 18px;border-radius:40px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

/* SYNC */
.sync-indicator{position:fixed;top:12px;right:16px;z-index:300;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);background:var(--surface);border:.5px solid var(--border);border-radius:40px;padding:4px 10px;transition:all .3s}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0}
.sync-indicator.syncing .sync-dot{background:var(--media);animation:pulse .8s infinite}
.sync-indicator.ok .sync-dot{background:var(--baja)}
.sync-indicator.error .sync-dot{background:var(--alta)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* NOTES */
.notes-hdr{padding:48px 22px 14px;border-bottom:.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.notes-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:12px}
.notes-area-tabs{display:flex;gap:0;background:var(--surface2);border-radius:40px;padding:3px;overflow-x:auto}
.nat{flex-shrink:0;font-size:11px;font-weight:500;padding:6px 14px;border-radius:40px;border:none;background:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .15s}
.nat.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.notes-body{padding:14px 22px 90px}
.note-add-box{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:16px}
.note-textarea{width:100%;background:var(--surface2);border:none;border-radius:var(--rs);padding:10px 12px;font-size:14px;color:var(--text);font-family:inherit;outline:none;resize:none;min-height:80px;line-height:1.6}
.note-textarea::placeholder{color:var(--text3)}.note-textarea:focus{box-shadow:0 0 0 1.5px var(--border2)}
.note-add-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.note-area-sel{background:var(--surface2);border:none;border-radius:var(--rs);padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit;outline:none;cursor:pointer}
.note-save-btn{background:var(--text);color:var(--bg);border:none;border-radius:var(--rs);padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;margin-left:auto}
.note-save-btn:active{transform:scale(.97)}
.note-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;animation:fadeIn .25s}
.note-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.note-text{font-size:14px;color:var(--text);line-height:1.6;flex:1;white-space:pre-wrap;word-break:break-word}
.note-actions{display:flex;gap:3px;flex-shrink:0}
.note-meta{display:flex;gap:7px;margin-top:8px;align-items:center;flex-wrap:wrap}
.note-date{font-size:11px;color:var(--text3)}
.note-to-task-btn{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--hoy-bg);color:var(--hoy);border:.5px solid rgba(42,82,168,.2);cursor:pointer;font-family:inherit;transition:all .15s}
.note-to-task-btn:hover{background:var(--hoy);color:#fff}
.note-editing textarea{width:100%;background:var(--surface2);border:none;border-radius:var(--rs);padding:8px 10px;font-size:14px;color:var(--text);font-family:inherit;outline:none;resize:none;line-height:1.6}
.note-editing textarea:focus{box-shadow:0 0 0 1.5px var(--border2)}
.note-edit-save{font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;background:var(--text);color:var(--bg);border:none;cursor:pointer;font-family:inherit;margin-top:6px}
.empty-notes{text-align:center;padding:28px 0;font-size:13px;color:var(--text3)}

/* SEARCH */
.search-hdr{padding:48px 22px 14px;border-bottom:.5px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:10}
.search-title{font-family:'DM Serif Display',serif;font-size:24px;margin-bottom:12px}
.search-input-wrap{position:relative}
.search-input{width:100%;background:var(--surface);border:.5px solid var(--border2);border-radius:var(--rs);padding:10px 14px 10px 38px;font-size:14px;color:var(--text);font-family:inherit;outline:none}
.search-input:focus{box-shadow:0 0 0 1.5px var(--hoy)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none}
.search-icon svg{width:16px;height:16px;stroke:var(--text3);stroke-width:2;fill:none}
.search-filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sf-btn{font-size:11px;font-weight:500;padding:5px 12px;border-radius:20px;border:.5px solid var(--border2);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.sf-btn.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.search-body{padding:14px 22px 90px}
.search-empty{text-align:center;padding:40px 0;font-size:13px;color:var(--text3)}
.search-result-type{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;background:var(--surface2);color:var(--text2)}
.search-highlight{background:rgba(255,220,0,.35);border-radius:3px;padding:0 1px}

/* MEETING NOTES */
.note-pending-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--rs);background:var(--surface2)}
.note-pending-text{flex:1;font-size:13px;color:var(--text)}
.note-pending-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0;opacity:.6}
.note-pending-del:hover{opacity:1}
.note-card-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:6px}
.note-card-section{font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:8px 0 4px}
.note-pending-card-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:var(--rs);background:var(--surface2);margin-bottom:4px}
.note-pending-card-item.converted{opacity:.45}
.note-pending-card-item.converted .note-pending-text{text-decoration:line-through}
.npc-check{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.npc-check:hover{border-color:var(--baja)}.npc-check.checked{background:var(--baja);border-color:var(--baja)}
.npc-check svg{width:8px;height:8px;stroke:var(--bg);stroke-width:2.5;fill:none}
.npc-to-task{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;background:var(--hoy-bg);color:var(--hoy);border:.5px solid rgba(42,82,168,.2);cursor:pointer;font-family:inherit;white-space:nowrap}
.npc-to-task:hover{background:var(--hoy);color:#fff}
.npc-to-task.done{background:var(--baja-bg);color:var(--baja);border-color:rgba(58,122,74,.2);cursor:default}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.auth-logo{font-family:'DM Serif Display',serif;font-size:40px;margin-bottom:4px;text-align:center}
.auth-tagline{font-size:14px;color:var(--text2);margin-bottom:32px;text-align:center}
.auth-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:24px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.auth-tabs{display:flex;background:var(--surface2);border-radius:40px;padding:3px;margin-bottom:20px}
.auth-tab{flex:1;font-size:13px;font-weight:500;padding:7px 0;border-radius:40px;border:none;background:none;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .15s;text-align:center}
.auth-tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.auth-field{width:100%;background:var(--surface2);border:none;border-radius:var(--rs);padding:11px 14px;font-size:14px;color:var(--text);font-family:inherit;outline:none;margin-bottom:10px}
.auth-field::placeholder{color:var(--text3)}.auth-field:focus{box-shadow:0 0 0 1.5px var(--hoy)}
.auth-btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:var(--rs);padding:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-bottom:10px}
.auth-btn:active{opacity:.85}
.auth-divider{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px;color:var(--text3)}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:.5px;background:var(--border2)}
.auth-google{width:100%;background:var(--surface2);color:var(--text);border:.5px solid var(--border2);border-radius:var(--rs);padding:11px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px}
.auth-google:hover{background:var(--border)}
.auth-google svg{width:18px;height:18px;flex-shrink:0}
.auth-msg{font-size:12px;text-align:center;padding:8px 10px;border-radius:var(--rs);margin-top:8px;display:none}
.auth-msg.error{display:block;background:var(--alta-bg);color:var(--alta)}
.auth-msg.success{display:block;background:var(--baja-bg);color:var(--baja)}
.auth-link{font-size:12px;color:var(--hoy);background:none;border:none;cursor:pointer;font-family:inherit;display:block;text-align:center;margin-top:8px;padding:0}
.home-user{font-size:12px;color:var(--text3);margin-top:3px;display:flex;align-items:center;gap:8px}
.logout-btn{font-size:11px;color:var(--alta);background:none;border:none;cursor:pointer;font-family:inherit;padding:0}
/* AREA CARDS dynamic */
.area-icon-wrap{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:20px}
.add-area-card{background:var(--surface2);border:.5px dashed var(--border2);border-radius:var(--r);padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:110px;transition:background .15s}
.add-area-card:hover{background:var(--border)}
.add-area-card svg{width:24px;height:24px;stroke:var(--text3);stroke-width:1.5;fill:none}
.add-area-card span{font-size:13px;color:var(--text3)}
.area-edit-btn{position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;color:var(--text3);padding:4px;border-radius:var(--rs);opacity:0;transition:opacity .15s}
.area-card:hover .area-edit-btn{opacity:1}
.area-card:active .area-edit-btn{opacity:1}
.area-edit-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none}
/* Area modal */
.color-picker{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .12s}
.color-swatch:hover{transform:scale(1.15)}.color-swatch.selected{border-color:var(--text);transform:scale(1.1)}
.emoji-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.emoji-opt{width:34px;height:34px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;background:var(--surface2);border:1.5px solid transparent}
.emoji-opt:hover{background:var(--border)}.emoji-opt.selected{border-color:var(--text);background:var(--border)}
.field-label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}
.modal-del{background:var(--alta-bg);color:var(--alta);border:none;border-radius:var(--rs);padding:9px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.loading-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-logo{font-family:'DM Serif Display',serif;font-size:32px}
.loading-dot{width:8px;height:8px;border-radius:50%;background:var(--text3);animation:pulse .8s infinite}
</style>
</head>
<body>


<!-- LOADING -->
<div class="screen active" id="screen-loading">
  <div class="loading-wrap"><div class="loading-logo">Mi Día</div><div class="loading-dot"></div></div>
</div>

<!-- AUTH -->
<div class="screen" id="screen-auth">
  <div class="auth-wrap">
    <div class="auth-logo">Mi Día</div>
    <div class="auth-tagline">Tu planner de oficina</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="atab-login" onclick="switchAuthTab('login')">Iniciar sesión</button>
        <button class="auth-tab" id="atab-register" onclick="switchAuthTab('register')">Registrarse</button>
      </div>
      <div id="auth-login-form">
        <input type="email" class="auth-field" id="loginEmail" placeholder="Correo electrónico"/>
        <input type="password" class="auth-field" id="loginPass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button class="auth-btn" onclick="doLogin()">Iniciar sesión</button>
        <button class="auth-link" onclick="doReset()">¿Olvidaste tu contraseña?</button>
      </div>
      <div id="auth-register-form" style="display:none">
        <input type="text" class="auth-field" id="regName" placeholder="Tu nombre"/>
        <input type="email" class="auth-field" id="regEmail" placeholder="Correo electrónico"/>
        <input type="password" class="auth-field" id="regPass" placeholder="Contraseña (mínimo 6 caracteres)" onkeydown="if(event.key==='Enter')doRegister()"/>
        <button class="auth-btn" onclick="doRegister()">Crear cuenta</button>
      </div>
      <div class="auth-divider">o</div>
      <button class="auth-google" onclick="doGoogle()">
        <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continuar con Google
      </button>
      <div id="authMsg" class="auth-msg"></div>
    </div>
  </div>
</div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="home-hdr">
    <div class="home-greeting" id="homeGreeting">Buenos días</div>
    <div class="home-date" id="homeDate"></div>
    <div class="home-user"><span id="homeUserEmail"></span><button class="logout-btn" onclick="doLogout()">Cerrar sesión</button></div>
    <div class="home-stats">
      <div class="hstat"><div class="hstat-n" id="homeTotalHoy">0</div><div class="hstat-l">Hoy</div></div>
      <div class="hstat"><div class="hstat-n" id="homeTotalPend">0</div><div class="hstat-l">Pendientes</div></div>
      <div class="hstat"><div class="hstat-n" id="homeTotalVenc">0</div><div class="hstat-l">Vencidas</div></div>
    </div>
  </div>
  <div class="home-tabs">
    <button class="htab active" id="htab-hoy" onclick="switchTab('hoy')">Hacer hoy</button>
    <button class="htab" id="htab-pend" onclick="switchTab('pend')">Pendientes</button>
    <button class="htab" id="htab-venc" onclick="switchTab('venc')">Vencidas</button>
    <button class="htab" id="htab-areas" onclick="switchTab('areas')">Áreas</button>
  </div>
  <div class="hpanel active" id="hpanel-hoy">
    <div class="hoy-wrap"><div class="hoy-label"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Hacer hoy<span class="hoy-badge" id="homeHoyBadge">0</span></div><div id="homeHoyList" class="task-list"></div></div>
  </div>
  <div class="hpanel" id="hpanel-pend"><div id="homePendList" class="task-list"></div></div>
  <div class="hpanel" id="hpanel-venc"><div id="homeVencList" class="task-list"></div></div>
  <div class="hpanel" id="hpanel-areas" style="padding:0"><div class="areas-grid" id="areasGrid"></div></div>
</div>

<!-- INNER -->
<div class="screen pb90" id="screen-inner">
  <div class="page-hdr">
    <button class="back-btn" onclick="goHome()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>Inicio</button>
    <div class="page-title"><div class="title-dot" id="innerDot"></div><span id="innerTitle"></span></div>
    <div class="stats-pill">
      <div class="sp"><div class="sp-n" id="spHoy">0</div><div class="sp-l">Hoy</div></div>
      <div class="sp"><div class="sp-n" id="spPend">0</div><div class="sp-l">Pendientes</div></div>
      <div class="sp"><div class="sp-n" id="spVenc">0</div><div class="sp-l">Vencidas</div></div>
      <div class="sp"><div class="sp-n" id="spDone">0</div><div class="sp-l">Listas</div></div>
    </div>
  </div>
  <div class="alerts" id="alertsBox"></div>
  <div class="section">
    <div class="section-hdr"><div class="section-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Nueva tarea</div></div>
    <div class="add-form">
      <div class="add-r1"><input type="text" class="fi fi-text" id="taskInput" placeholder="¿Qué necesitas hacer?"/></div>
      <div class="add-r2">
        <div class="prio-btns"><button class="prio-btn alta selected" data-p="alta" onclick="selPrio(this)">Alta</button><button class="prio-btn media" data-p="media" onclick="selPrio(this)">Media</button><button class="prio-btn baja" data-p="baja" onclick="selPrio(this)">Baja</button></div>
        <div class="sub-wrap"><input type="text" class="fi subarea-input" id="subareaInput" placeholder="Subárea / empresa..." autocomplete="off" oninput="showSubDD('subareaInput','subareaDD')" onblur="hideDD('subareaDD')" onkeydown="subKey(event,'subareaDD')"/><div class="sub-dd" id="subareaDD" style="display:none"></div></div>
        <input type="date" class="fi" id="dueDate"/>
        <input type="time" class="fi" id="dueTime" value="09:00"/>
        <label class="novc-label"><input type="checkbox" id="noVenc" onchange="toggleNV(this,'dueDate','dueTime')"/> Sin venc.</label>
        <button class="add-main" onclick="addTask()">Agregar</button>
      </div>
    </div>
  </div>
  <div class="section" id="hoySection"><div class="hoy-wrap"><div class="hoy-label"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Hacer hoy<span class="hoy-badge" id="hoyCount">0</span></div><div class="task-list" id="hoyList"></div></div></div>
  <div class="section"><div class="section-hdr"><div class="section-title"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Pendientes</div><span class="section-count" id="pendCount">0</span></div><div class="task-list" id="taskList"></div></div>
  <div class="section" id="doneSection"><div class="section-hdr"><div class="section-title"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Completadas hoy</div><span class="section-count" id="doneCount">0</span></div><div class="task-list" id="doneList"></div></div>
  <div class="bot-bar">
    <button class="bot-btn" onclick="moverVencidas()"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>Mover vencidas</button>
    <button class="bot-btn danger" onclick="limpiarComp()"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>Limpiar completadas</button>
  </div>
</div>

<!-- CALENDAR -->
<div class="screen pb90" id="screen-cal">
  <div class="cal-hdr">
    <div class="cal-title">Calendario</div>
    <div class="cal-nav"><div class="cal-month" id="calMonthLabel"></div>
      <div style="display:flex;gap:5px;align-items:center">
        <button class="cal-today-btn" onclick="goToday()">Hoy</button>
        <div class="cal-nav-btns"><button class="cal-nav-btn" onclick="changeMonth(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><button class="cal-nav-btn" onclick="changeMonth(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button></div>
      </div>
    </div>
  </div>
  <div class="cal-legend" id="calLegend"></div>
  <div class="cal-grid"><div class="cal-dow-row" id="calDow"></div><div class="cal-days" id="calDays"></div></div>

// ── SYNC ──────────────────────────────────────────────────────────────────────
function setSyncStatus(state, label) {
  const ind = document.getElementById('syncIndicator'), lbl = document.getElementById('syncLabel');
  ind.className = 'sync-indicator ' + state; lbl.textContent = label;
}
async function pushData() {
  if (!currentUser) return;
  setSyncStatus('syncing', 'Guardando...');
  try {
    const session = (await sb.auth.getSession()).data.session;
    const token = session ? session.access_token : SUPABASE_ANON_KEY;
    const res = await fetch(SUPABASE_URL + '/rest/v1/midia_data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ id: currentUser.id, tasks, sub_mem: subMem, notes, areas, updated_at: new Date().toISOString() })
    });
    if (res.ok) setSyncStatus('ok', 'Sincronizado');
    else { const e = await res.text(); console.error(e); setSyncStatus('error', 'Error al guardar'); }
  } catch(e) { setSyncStatus('error', 'Sin conexión'); }
}
async function pullData() {
  if (!currentUser) return false;
  setSyncStatus('syncing', 'Cargando...');
  try {
    const session = (await sb.auth.getSession()).data.session;
    const token = session ? session.access_token : SUPABASE_ANON_KEY;
    const res = await fetch(SUPABASE_URL + '/rest/v1/midia_data?id=eq.' + currentUser.id + '&select=tasks,sub_mem,notes,areas,updated_at', {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) { setSyncStatus('error', 'Error al cargar'); return false; }
    const data = await res.json();
    if (data && data[0]) {
      const r = data[0]; lastRemoteUpdate = r.updated_at;
      if (r.tasks && Object.keys(r.tasks).length > 0) tasks = r.tasks;
      if (r.sub_mem) subMem = r.sub_mem;
      if (r.notes) notes = r.notes;
      if (r.areas && r.areas.length > 0) areas = r.areas;
      areas.forEach(a => { if (!tasks[a.id]) tasks[a.id] = []; if (!notes[a.id]) notes[a.id] = []; });
      setSyncStatus('ok', 'Sincronizado'); return true;
    }
    areas = [...DEFAULT_AREAS];
    areas.forEach(a => { if (!tasks[a.id]) tasks[a.id] = []; if (!notes[a.id]) notes[a.id] = []; });
    setSyncStatus('ok', 'Sincronizado'); return false;
  } catch(e) { setSyncStatus('error', 'Sin conexión'); return false; }
}
function schedulePush() { clearTimeout(syncTimeout); syncTimeout = setTimeout(() => pushData(), 1500); }
setInterval(async () => {
  if (!currentUser) return;

      const pulled = await pullData();
      if (pulled) { if (!cArea) renderHome(); else renderInner(); showToast('Datos actualizados'); }
    }

}, 30000);

function fmtDue(due,time,noVenc){if(noVenc||!due)return'Sin vencimiento';const t=td(),tmr=tmrw(),p=due.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];if(due===t)return'Hoy '+time;if(due===tmr)return'Mañana '+time;return days[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1)+' '+time;}

function taskCard(t,inHoy,area){
  const today=td(),a=area||cArea,aObj=areaById(a);

  let dueCls='due-tag';if(isOvd)dueCls+=' late';else if(isToday)dueCls+=' today';
  const pl=t.prio==='alta'?'↑ Alta':t.prio==='media'?'→ Media':'↓ Baja';
  const subs=t.subtasks||[],sd=subs.filter(s=>s.done).length;
  const aTag=area&&aObj?`<span style="font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;background:${aObj.color}22;color:${aObj.color}">${aObj.emoji} ${aObj.name}</span>`:'';
  const aArg=area?`,'${area}'`:'';
  return`<div class="${cls}">

        ${aTag}${t.subarea?`<span class="subarea-tag">${t.subarea}</span>`:''}${t.movedCount>0?`<span class="moved-tag">↷ ${t.movedCount}×</span>`:''}
        ${subs.length>0?`<button class="sub-toggle ${t._open?'open':''}" onclick="toggleSubtasks(event,${t.id}${aArg})"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>${sd}/${subs.length}</button>`:''}
      </div>
      ${subs.length>0?`<div class="sub-prog"><div class="sub-prog-bar" style="width:${subs.length?Math.round(sd/subs.length*100):0}%"></div></div>`:''}
      ${t._open?`<div class="subtask-list" id="slist-${t.id}">${subs.map((s,i)=>`<div class="subtask-item ${s.done?'done-sub':''}"><button class="sch ${s.done?'checked':''}" onclick="toggleSub(${t.id},${i}${aArg})"><svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg></button><span class="stxt">${s.text}</span><button class="sdel" onclick="delSub(${t.id},${i}${aArg})">×</button></div>`).join('')}<div class="sadd-row"><input class="sadd-inp" id="sadd-${t.id}" placeholder="Agregar ítem..." onkeydown="subtaskKey(event,${t.id}${aArg})"/><button class="sadd-btn" onclick="addSubtask(${t.id}${aArg})">+ Agregar</button></div></div>`:''}
    </div>
    <div class="task-actions">
      ${!t.done&&!inHoy&&t.due!==today?`<button class="icon-btn" onclick="sendToHoy(${t.id}${aArg})"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></button>`:''}
      <button class="icon-btn" onclick="openSubtasks(${t.id}${aArg})"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
      <button class="icon-btn" onclick="openEdit(${t.id}${aArg})"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      <button class="icon-btn" onclick="copyTask(${t.id}${aArg})"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg></button>
      <button class="icon-btn" onclick="deleteTask(${t.id}${aArg})"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>

}

function groupCards(items,inHoy,withArea){
  if(!items.length)return'<div class="empty-msg">Sin tareas</div>';
  if(!withArea)return items.map(t=>taskCard(t,inHoy,null)).join('');
  let html='';
  areas.forEach(area=>{
    const at=items.filter(t=>t._area===area.id);if(!at.length)return;
    html+=`<div class="group-hdr" style="color:${area.color}"><span>${area.emoji} ${area.name}</span><div class="group-hdr-line" style="background:${area.color}22"></div></div>`;
    const g={};at.forEach(t=>{const k=t.subarea||'__sin__';if(!g[k])g[k]=[];g[k].push(t);});
    Object.keys(g).sort((x,y)=>x==='__sin__'?1:y==='__sin__'?-1:x.localeCompare(y)).forEach(k=>{
      if(k!=='__sin__')html+=`<div class="group-hdr" style="padding-left:8px"><span style="font-size:10px">${k}</span><div class="group-hdr-line"></div></div>`;
      html+=g[k].map(t=>taskCard(t,inHoy,t._area)).join('');
    });
  });
  return html;
}
function groupBySub(items,inHoy){
  const g={};items.forEach(t=>{const k=t.subarea||'__sin__';if(!g[k])g[k]=[];g[k].push(t);});
  const keys=Object.keys(g).sort((a,b)=>a==='__sin__'?1:b==='__sin__'?-1:a.localeCompare(b));
  let html='';keys.forEach(k=>{if(k!=='__sin__')html+=`<div class="group-hdr"><span>${k}</span><div class="group-hdr-line"></div></div>`;html+=g[k].map(t=>taskCard(t,inHoy,null)).join('');});
  return html||'<div class="empty-msg">Sin tareas</div>';
}

function renderInner(){
  const today=td();const ts=tasks[cArea]||[];
  const pend=ts.filter(t=>!t.done);const done=ts.filter(t=>t.done&&t.doneDate===today);
  const hoyT=pend.filter(t=>!t.noVenc&&t.due===today).sort((a,b)=>{const p={alta:0,media:1,baja:2};return p[a.prio]-p[b.prio]||a.time.localeCompare(b.time);});
  const others=pend.filter(t=>t.noVenc||t.due!==today).sort((a,b)=>{const p={alta:0,media:1,baja:2};if(a.noVenc&&!b.noVenc)return 1;if(!a.noVenc&&b.noVenc)return-1;if(a.due!==b.due)return(a.due||'9999').localeCompare(b.due||'9999');return p[a.prio]-p[b.prio];});
  const ovd=pend.filter(t=>!t.noVenc&&t.due&&t.due<today).length;
  document.getElementById('spHoy').textContent=hoyT.length;document.getElementById('spPend').textContent=pend.length;
  document.getElementById('spVenc').textContent=ovd;document.getElementById('spDone').textContent=done.length;

  const box=document.getElementById('alertsBox');box.innerHTML='';

  if(ovd>0)alts.push({type:'danger',text:`${ovd} tarea${ovd>1?'s':''} se movió a "Hacer hoy" por vencer.`});

  alts.forEach(a=>{const d=document.createElement('div');d.className=`alert alert-${a.type}`;d.innerHTML=`<span class="alert-text">${a.text}</span><button class="alert-close" onclick="this.parentElement.remove()">×</button>`;box.appendChild(d);});

function getAllByDay(){const map={};areas.forEach(a=>(tasks[a.id]||[]).forEach(t=>{if(!t.noVenc&&t.due){if(!map[t.due])map[t.due]=[];map[t.due].push({...t,_area:a.id});}}));return map;}
function renderCal(){
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('calMonthLabel').textContent=months[m]+' '+y;
  document.getElementById('calDow').innerHTML=['L','M','M','J','V','S','D'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const legend=document.getElementById('calLegend');
  if(legend)legend.innerHTML=areas.map(a=>`<div class="leg-item"><div class="leg-dot" style="background:${a.color}"></div>${a.name}</div>`).join('')+'<div class="leg-item"><div class="leg-dot" style="background:var(--alta)"></div>Vencida</div>';
  const today=td(),map=getAllByDay();
  const fd=new Date(y,m,1).getDay(),off=fd===0?6:fd-1,dim=new Date(y,m+1,0).getDate();
  let html='';
  for(let i=0;i<off;i++){const d=new Date(y,m,-(off-i-1));html+=`<div class="cal-day other-month"><span class="cal-day-n">${d.getDate()}</span></div>`;}
  for(let d=1;d<=dim;d++){
    const key=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=map[key]||[];const isToday=key===today,isSel=key===selDay,hasOvd=dt.some(t=>!t.done&&key<today);
    let cls='cal-day';if(isToday&&!isSel)cls+=' today';if(isSel)cls+=' selected';if(hasOvd&&!isSel)cls+=' has-overdue';
    const dots=dt.slice(0,5).map(t=>{const aObj=areaById(t._area);return`<div class="cal-dot" style="background:${t.done?'var(--text3)':key<today&&!t.done?'var(--alta)':(aObj?aObj.color:'#999')}"></div>`;}).join('');
    html+=`<div class="${cls}" onclick="selectDay('${key}')"><span class="cal-day-n">${d}</span>${dots?`<div class="cal-dots">${dots}</div>`:''}</div>`;
  }
  document.getElementById('calDays').innerHTML=html;updateCalBadge();
}

function renderCalDetail(){

  const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const lbl=`${days[d.getDay()]} ${d.getDate()} de ${months[d.getMonth()]} ${p[0]}${selDay===today?' — Hoy':selDay<today?' — Pasado':''}`;

}
function deleteNote(id,area){notes[area]=(notes[area]||[]).filter(n=>n.id!==id);schedulePush();renderNotes();showToast('Nota eliminada');}
function startEditNote(id,area){editingNoteId={id,area};renderNotes();setTimeout(()=>{const el=document.getElementById('nedit-'+id);if(el){el.focus();el.selectionStart=el.value.length;}},50);}
function saveNoteEdit(id,area){const titleEl=document.getElementById('netitle-'+id),textEl=document.getElementById('nedit-'+id);if(!textEl)return;const n=(notes[area]||[]).find(n=>n.id===id);if(!n)return;if(titleEl)n.title=titleEl.value.trim()||'Sin título';n.text=textEl.value.trim();n.updatedAt=new Date().toISOString();editingNoteId=null;schedulePush();renderNotes();showToast('Nota actualizada');}
function pendingToTask(noteId,area,pendingId){const n=(notes[area]||[]).find(n=>n.id===noteId);if(!n)return;const p=n.pending.find(p=>p.id===pendingId);if(!p||p.taskCreated)return;cArea=area;const aObj=areaById(area);document.getElementById('innerTitle').textContent=aObj?aObj.name:area;document.getElementById('innerDot').style.background=aObj?aObj.color:'#999';document.getElementById('dueDate').value=td();document.getElementById('dueTime').value='09:00';document.getElementById('noVenc').checked=false;document.getElementById('dueDate').disabled=false;document.getElementById('dueTime').disabled=false;document.getElementById('subareaInput').value='';resetPrio();document.getElementById('taskInput').value=p.text;p.taskCreated=true;schedulePush();document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('screen-inner').classList.add('active');renderInner();showToast('Edita y agrega la tarea');}
function noteToTask(id,area){const n=(notes[area]||[]).find(n=>n.id===id);if(!n)return;cArea=area;const aObj=areaById(area);document.getElementById('innerTitle').textContent=aObj?aObj.name:area;document.getElementById('innerDot').style.background=aObj?aObj.color:'#999';document.getElementById('dueDate').value=td();document.getElementById('dueTime').value='09:00';document.getElementById('noVenc').checked=false;document.getElementById('dueDate').disabled=false;document.getElementById('dueTime').disabled=false;document.getElementById('subareaInput').value='';resetPrio();document.getElementById('taskInput').value=n.title||n.text;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('screen-inner').classList.add('active');renderInner();showToast('Edita y agrega la tarea');}
function fmtNoteDate(iso){const d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/86400000);if(diff===0)return'Hoy '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});if(diff===1)return'Ayer';if(diff<7)return d.toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});return d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});}
function switchNoteTab(tab){noteTab=tab;updateNoteTabs();renderNotes();}
function renderNotes(){
  const el=document.getElementById('notesList');let list=[];
  if(noteTab==='all'){areas.forEach(a=>(notes[a.id]||[]).forEach(n=>list.push({...n,_area:a.id})));}
  else{list=(notes[noteTab]||[]).map(n=>({...n,_area:noteTab}));}
  list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!list.length){el.innerHTML='<div class="empty-notes">Sin notas.</div>';return;}
  el.innerHTML=list.map(n=>{
    const isEditing=editingNoteId&&editingNoteId.id===n.id;const aObj=areaById(n._area);const pends=n.pending||[];
    const pendHtml=pends.length>0?`<div style="font-size:10px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:8px 0 4px">Pendientes</div>${pends.map(p=>`<div class="note-pending-card-item ${p.taskCreated?'converted':''}"><div class="npc-check ${p.taskCreated?'checked':''}">${p.taskCreated?'<svg viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="var(--bg)" stroke-width="2.5" fill="none"/></svg>':''}</div><span class="note-pending-text">${p.text}</span>${!p.taskCreated?`<button class="npc-to-task" onclick="pendingToTask(${n.id},'${n._area}',${p.id})">→ Crear tarea</button>`:'<span class="npc-to-task done">✓ Tarea creada</span>'}</div>`).join('')}`:'';
    return`<div class="note-card"><div class="note-card-top">${isEditing?`<div style="flex:1"><input type="text" class="fi fi-text" id="netitle-${n.id}" value="${(n.title||'').replace(/"/g,'&quot;')}" style="margin-bottom:7px;width:100%"/><textarea class="note-textarea" id="nedit-${n.id}" rows="4">${n.text||''}</textarea><button class="note-edit-save" onclick="saveNoteEdit(${n.id},'${n._area}')">Guardar</button></div>`:`<div style="flex:1"><div class="note-card-title">${n.title||'Sin título'}</div>${n.text?`<div class="note-text" style="font-size:13px;color:var(--text2)">${n.text}</div>`:''}${pendHtml}</div>`}<div class="note-actions"><button class="icon-btn" onclick="startEditNote(${n.id},'${n._area}')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="icon-btn" onclick="deleteNote(${n.id},'${n._area}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button></div></div><div class="note-meta">${aObj?`<span style="font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;background:${aObj.color}22;color:${aObj.color}">${aObj.emoji} ${aObj.name}</span>`:''}<span class="note-date">${fmtNoteDate(n.createdAt)}</span><button class="note-to-task-btn" onclick="noteToTask(${n.id},'${n._area}')">→ Como tarea</button></div></div>`;
  }).join('');
}

// SEARCH
function setSFilter(f){searchFilter=f;document.querySelectorAll('.sf-btn').forEach(b=>b.classList.remove('active'));document.getElementById('sf-'+f).classList.add('active');doSearch();}
function highlight(text,q){if(!q)return text;const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return text.replace(re,'<span class="search-highlight">$1</span>');}
function doSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const el=document.getElementById('searchResults');
  if(!q){el.innerHTML='<div class="search-empty">Escribe para buscar</div>';return;}
  const results=[];
  if(searchFilter==='all'||searchFilter==='tasks'){areas.forEach(a=>(tasks[a.id]||[]).forEach(t=>{if(t.text.toLowerCase().includes(q)||(t.subarea&&t.subarea.toLowerCase().includes(q)))results.push({type:'task',item:t,area:a.id});}));}
  if(searchFilter==='all'||searchFilter==='notes'){areas.forEach(a=>(notes[a.id]||[]).forEach(n=>{if((n.title&&n.title.toLowerCase().includes(q))||(n.text&&n.text.toLowerCase().includes(q)))results.push({type:'note',item:n,area:a.id});}));}
  if(!results.length){el.innerHTML=`<div class="search-empty">Sin resultados para "${q}"</div>`;return;}
  el.innerHTML=results.map(r=>{
    const aObj=areaById(r.area);
    if(r.type==='task'){const t=r.item,isOvd=!t.done&&!t.noVenc&&t.due&&t.due<td();return`<div class="task-card ${t.done?'done':''} ${isOvd?'overdue':''}" style="margin-bottom:8px"><button class="check-btn ${t.done?'checked':''}" onclick="toggleDone(${t.id},'${r.area}')"><svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg></button><div class="task-body"><div class="task-title">${highlight(t.text,q)}</div><div class="task-meta"><span class="search-result-type">Tarea</span>${aObj?`<span style="font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500;background:${aObj.color}22;color:${aObj.color}">${aObj.emoji} ${aObj.name}</span>`:''}<span class="prio-tag ${t.prio}">${t.prio==='alta'?'↑ Alta':t.prio==='media'?'→ Media':'↓ Baja'}</span></div></div><div class="task-actions"><button class="icon-btn" onclick="openEdit(${t.id},'${r.area}')"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button></div></div>`;}
    const n=r.item;return`<div class="note-card" style="margin-bottom:8px"><div class="note-card-top"><div style="flex:1"><div class="note-card-title">${highlight(n.title||'Sin título',q)}</div>${n.text?`<div style="font-size:12px;color:var(--text2);margin-top:3px">${highlight(n.text,q)}</div>`:''}</div><button class="icon-btn" onclick="noteToTask(${n.id},'${r.area}')"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></button></div><div class="note-meta"><span class="search-result-type">Nota</span>${aObj?`<span style="font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500;background:${aObj.color}22;color:${aObj.color}">${aObj.emoji} ${aObj.name}</span>`:''}<span class="note-date">${fmtNoteDate(n.createdAt)}</span></div></div>`;
  }).join('');
}

function setHeader(){const now=new Date(),h=now.getHours();document.getElementById('homeGreeting').textContent=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';const days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];const months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];document.getElementById('homeDate').textContent=days[now.getDay()]+' '+now.getDate()+' de '+months[now.getMonth()];}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ── BOOT ──────────────────────────────────────────────────────────────────────
async function initApp(user) {
  currentUser = user;
  const email = user.email || (user.user_metadata && user.user_metadata.name) || '';
  document.getElementById('homeUserEmail').textContent = email;
  document.getElementById('mainNav').style.display = 'flex';
  document.getElementById('syncIndicator').style.display = 'flex';
  setHeader(); selDay = td();
  await pullData();
  autoMove(); schedulePush();
  areas.forEach(a => { if (!tasks[a.id]) tasks[a.id] = []; if (!notes[a.id]) notes[a.id] = []; });
  updateNoteTabs();
  showOnlyScreen('home');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-home').classList.add('active');
  renderHome();
  setInterval(() => { setHeader(); if (!cArea) renderHome(); }, 60000);
}

sb.auth.onAuthStateChange(async (event, session) => {
  if (session && session.user) { await initApp(session.user); }
  else { document.getElementById('mainNav').style.display = 'none'; document.getElementById('syncIndicator').style.display = 'none'; showOnlyScreen('auth'); }
});

sb.auth.getSession().then(({ data: { session } }) => { if (!session) showOnlyScreen('auth'); });
</script>
